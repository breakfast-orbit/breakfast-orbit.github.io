<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ page.title | default: site.title }}</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1c1c1e;
    --fg-muted: #6b6b70;
    --link: #3a5f8a;
    --hr: #dcdcdf;
    --code-bg: #f2f2f4;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --fg: #e6e6e8;
      --fg-muted: #9c9ca2;
      --link: #8fb3de;
      --hr: #3a3a3d;
      --code-bg: #232326;
    }
  }

  * {
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    padding: 2.5rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 16px;
    line-height: 1.8;
    word-break: normal;
    overflow-wrap: anywhere;
  }

  .page {
    max-width: 40rem;
    margin: 0 auto;
  }

  h1, h2, h3, h4 {
    font-weight: 600;
    line-height: 1.5;
    color: var(--fg);
  }

  h1 {
    font-size: 1.65rem;
    margin: 0 0 1.25rem;
  }

  h2 {
    font-size: 1.25rem;
    margin: 2.5rem 0 1rem;
  }

  h3 {
    font-size: 1.05rem;
    margin: 1.75rem 0 0.75rem;
  }

  p {
    margin: 0 0 1.1em;
  }

  ul, ol {
    margin: 0 0 1.1em;
    padding-left: 1.4em;
  }

  li {
    margin-bottom: 0.5em;
    line-height: 1.8;
  }

  a {
    color: var(--link);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  hr {
    border: none;
    border-top: 1px solid var(--hr);
    margin: 3rem 0;
  }

  code {
    background: var(--code-bg);
    padding: 0.15em 0.35em;
    border-radius: 0.25em;
    font-size: 0.9em;
  }

  .lang-switch {
    margin: -0.5rem 0 1.75rem;
  }

  .lang-switch a {
    display: inline-block;
    font-size: 0.9rem;
    color: var(--fg-muted);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
</style>
</head>
<body>
  <div class="page">
    {{ content }}
  </div>
</body>
</html>
